/* 텍스트 포맷터: 링크와 해시태그 색칠 */
function formatText(str, opts = {}) {
  let s = str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if (opts.links) {
    s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1<\/a>');
  }
  if (opts.hashtags) {
    s = s.replace(/(#[^\s#]+)/g, '<span class="pv-tag">$1<\/span>');
  }
  return s;
}

/* 1. 인스타그램 캐러셀 초기화 */
function initCarousel(id, dotsId, images) {
  const el = document.getElementById(id);
  if (!el) return;
  const track = el.querySelector('.pv-track');
  const countEl = el.querySelector('.pv-count');
  const prevBtn = el.querySelector('.pv-nav--prev');
  const nextBtn = el.querySelector('.pv-nav--next');
  const dotsEl = dotsId ? document.getElementById(dotsId) : null;

  if (!images || images.length === 0) {
    el.innerHTML = '<div class="pv-carousel--empty" style="height:100%">등록된 이미지가 없습니다</div>';
    return;
  }

  images.forEach((src, idx) => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = (idx + 1) + '번째 이미지';
    track.appendChild(img);

    if (dotsEl && images.length > 1) {
      const dot = document.createElement('i');
      if (idx === 0) dot.className = 'on';
      dotsEl.appendChild(dot);
    }
  });

  let cur = 0;
  const update = (n) => {
    cur = Math.max(0, Math.min(images.length - 1, n));
    track.style.transform = 'translateX(-' + (cur * 100) + '%)';
    if (countEl) countEl.textContent = (cur + 1) + '/' + images.length;
    if (prevBtn) prevBtn.style.display = cur === 0 ? 'none' : 'grid';
    if (nextBtn) nextBtn.style.display = cur === images.length - 1 ? 'none' : 'grid';
    if (dotsEl) {
      [...dotsEl.children].forEach((d, i) => d.className = i === cur ? 'on' : '');
    }
  };

  if (prevBtn) prevBtn.onclick = () => update(cur - 1);
  if (nextBtn) nextBtn.onclick = () => update(cur + 1);

  // 터치 스와이프
  let startX = null;
  el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (startX === null) return;
    const diff = e.changedTouches[0].clientX - startX;
    if (Math.abs(diff) > 40) update(cur + (diff < 0 ? 1 : -1));
    startX = null;
  });

  update(0);
}

  const renderExpanded = () => {
    box.innerHTML = formatText(full, { links: true, hashtags: true }) +
      '<button type="button" class="pv-toggle pv-toggle--block">간략히</button>';
    const btn = box.querySelector('button');
    if (btn) btn.onclick = renderCollapsed;
  };

  renderCollapsed();
})();

/* 4. 다크/라이트 테마 전환 */
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-btn');
  try {
    const saved = localStorage.getItem('preview-theme');
    if (saved) root.dataset.theme = saved;
  } catch (e) {}

  btn.onclick = () => {
    const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('preview-theme', next); } catch (e) {}
  };
})();
</script>
</body>
