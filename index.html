<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNS 콘텐츠 프리뷰 · 인스타그램 피드 & 유튜브 커뮤니티 미리보기</title>
    <meta name="description" content="문구와 이미지를 올리면 인스타그램 피드와 유튜브 커뮤니티 게시물이 실제 앱에서 어떻게 보일지 바로 확인하고, HTML 파일로 공유할 수 있습니다." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 첫 화면 깜빡임 방지: 저장된 테마 또는 시스템 설정을 렌더링 전에 적용
      try {
        var t = localStorage.getItem('preview-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
